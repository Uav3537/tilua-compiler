name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

# Only installs, builds and publishes. The tests are not run here: the release
# script (publish-tilua.mjs) runs build, typecheck and test on every package
# before anything is pushed, and then again in an empty directory from the
# lockfile (`rehearse`), which is this job minus the publish. Running them a
# third time here only made each release wait on a slow runner.
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Check Version
        id: check
        run: |
          PACKAGE=$(node -p "require('./package.json').name")
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view "$PACKAGE" version 2>/dev/null || echo "0.0.0")

          echo "package=$PACKAGE"
          echo "local=$LOCAL"
          echo "published=$PUBLISHED"

          if [ "$(npx semver "$LOCAL" -r ">$PUBLISHED")" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      # A push that did not bump the version publishes nothing, so it has
      # nothing to install or build either.
      - name: Update npm
        if: steps.check.outputs.should_publish == 'true'
        run: npm install -g npm@latest

      - name: Install Dependencies
        if: steps.check.outputs.should_publish == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.should_publish == 'true'
        run: npm run build

      - name: Publish
        if: steps.check.outputs.should_publish == 'true'
        run: npm publish --provenance
